<!DOCTYPE html>

<html lang="ja">
    <head>
        <title>Halloweenタイプ診断</title>
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <h1 class="quiz-title">Halloweenタイプ診断</h1>

        <div id="question-container">
            <p id="question-number">Question Number</p>
            <h2 id="question-title">Question Title</h2>

            <img src="images/spider-web.png", class="spider-web", alt="">

            <div id="answer-container">
                <button id="answer-a"></button>
                <button id="answer-b"></button>
                <button id="answer-c"></button>
            </div>

            <p id="error-message"></p>
            
            <div class="navigation-buttons">
                <button id="prev-button" type="button">前へ</button>
                <button id="next-button" type="button">次へ</button>
            </div>

            <div class="result-button">
                <button id="result-button" type="button">診断結果を見る</button>
            </div>

        </div>
        <script src="main.js"></script>
    </body>
</html>
